<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台美財富探索島 ｜ Stay Ahead. Stay Protected.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        @keyframes floatIsland {
            0% { transform: translateY(0px) rotateX(2deg) rotateY(0deg); }
            50% { transform: translateY(-6px) rotateX(2deg) rotateY(1deg); }
            100% { transform: translateY(0px) rotateX(2deg) rotateY(0deg); }
        }
        
        @keyframes bridgePulse {
            0% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(20, 184, 166, 0.5)); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(20, 184, 166, 0.9)); }
            100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(20, 184, 166, 0.5)); }
        }

        .floating-island {
            animation: floatIsland 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .bridge-glow {
            animation: bridgePulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-teal-50/30 to-indigo-50/50 text-slate-800 min-h-screen">

    <!-- Header 頂部橫幅：專屬卡通 Logo 與 Stay Ahead. Stay Protected. -->
    <header class="bg-gradient-to-r from-teal-900 via-teal-800 to-indigo-950 text-white py-8 px-6 shadow-xl relative overflow-hidden border-b border-teal-700/50">
        <div class="absolute right-6 -bottom-12 opacity-10 text-9xl select-none">🛡️</div>
        
        <div class="max-w-4xl mx-auto relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
            <div class="flex items-center space-x-4">
                <!-- 您的卡通肖像 Logo 放置處 (請將圖檔命名為 avatar.png 放在同資料夾) -->
                <div class="w-14 h-14 rounded-2xl bg-teal-700 border-2 border-amber-400 overflow-hidden shadow-md flex items-center justify-center shrink-0">
                    <img src="avatar.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="text-xs text-amber-300 font-bold hidden text-center">Logo</span>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                        台美財富探索島 <span class="text-teal-300 font-light text-base md:text-lg">| Wealth Exploration Island</span>
                    </h1>
                    <p class="text-teal-100 text-xs md:text-sm font-medium mt-1">
                        探索真實財務情境，釐清決策偏好，陪伴您穩健規劃跨境資產。
                    </p>
                </div>
            </div>

            <!-- 核心品牌精神口號區塊 -->
            <div class="bg-teal-950/65 backdrop-blur-md border border-teal-600/40 px-5 py-3 rounded-2xl shadow-lg shrink-0">
                <p class="text-[10px] text-teal-300 uppercase tracking-widest font-bold mb-0.5">Core Philosophy</p>
                <p class="text-lg md:text-xl font-black tracking-wide">
                    <span class="text-amber-400">Stay Ahead.</span> <span class="text-white">Stay Protected.</span>
                </p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 md:px-6 py-8">

        <!-- 🗺️ 3D 浮島互動視覺地圖 (兼具導覽選單功能) -->
        <section class="bg-slate-900 border border-teal-500/30 rounded-3xl p-6 md:p-8 shadow-2xl mb-8 relative overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(#14b8a6_1px,transparent_1px)] [background-size:24px_24px] opacity-15"></div>

            <div class="flex items-center justify-between mb-6 relative z-10">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-teal-100">🧭 3D 互動島嶼導覽地圖</h2>
                    <p class="text-teal-300/80 text-xs mt-1">點擊下方島嶼節點，直接切換情境模擬與對應計算器。</p>
                </div>
                <span class="bg-teal-500/20 text-teal-300 border border-teal-500/40 text-xs font-bold px-3 py-1 rounded-full">動態連動中</span>
            </div>

            <!-- 模擬雙子島視覺區 -->
            <div class="floating-island relative z-10 bg-gradient-to-r from-teal-800/85 to-indigo-900/85 border border-teal-400/40 rounded-2xl p-5 shadow-2xl text-center mb-6">
                <span class="bg-amber-400 text-slate-950 text-[10px] font-bold px-3 py-0.5 rounded-full uppercase tracking-wider">
                    跨太平洋財富與合規航線
                </span>
                <p class="text-xs text-teal-200 mt-2">Taiwan-US Wealth Exploration Network</p>
                <div class="w-36 h-1 bg-gradient-to-r from-teal-400 via-amber-300 to-indigo-400 mx-auto my-3 bridge-glow rounded-full"></div>
            </div>

            <!-- 6大島嶼節點按鈕列 (Master Navigation) -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 relative z-10">
                <button onclick="switchStation(1)" id="card-1" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">⚓</span>
                    <span class="text-xs font-bold block">職涯啟航港</span>
                </button>
                <button onclick="switchStation(2)" id="card-2" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">🏠</span>
                    <span class="text-xs font-bold block">安居生活城</span>
                </button>
                <button onclick="switchStation(3)" id="card-3" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">🎓</span>
                    <span class="text-xs font-bold block">下一代學院</span>
                </button>
                <button onclick="switchStation(4)" id="card-4" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">🏖️</span>
                    <span class="text-xs font-bold block">退休自由灣</span>
                </button>
                <button onclick="switchStation(5)" id="card-5" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">📜</span>
                    <span class="text-xs font-bold block">財富傳承島</span>
                </button>
                <button onclick="switchStation(6)" id="card-6" class="p-3 rounded-2xl border transition text-center shadow-md">
                    <span class="text-xl block mb-1">✈️</span>
                    <span class="text-xs font-bold block">跨境航道</span>
                </button>
            </div>
        </section>

        <!-- 📖 動態情境與專欄文章區 -->
        <section id="scenario-box" class="bg-white rounded-3xl p-6 md:p-8 shadow-xl mb-8 border border-slate-100">
            <!-- 內容由 JavaScript 動態渲染 -->
        </section>

        <!-- 🧮 動態計算器區 -->
        <section id="calculator-box" class="bg-white rounded-3xl p-6 md:p-8 shadow-xl mb-8 border border-slate-100">
            <!-- 計算器由 JavaScript 動態切換 -->
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 text-xs">
        <p>台美財富探索島 ｜ Stay Ahead. Stay Protected. 獨立理財教育與知識參考平台</p>
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        let currentStation = 1;

        function switchStation(stationNum) {
            currentStation = stationNum;
            
            // 更新 3D 地圖節點的選中外觀
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`card-${i}`);
                btn.className = stationNum === i 
                    ? "p-3 rounded-2xl border-2 border-teal-400 bg-teal-700 text-white transition text-center shadow-lg scale-105" 
                    : "p-3 rounded-2xl border border-slate-700 bg-slate-800 text-slate-300 hover:border-teal-400 hover:bg-slate-700 transition text-center shadow-md";
            }
            const btn6 = document.getElementById('card-6');
            btn6.className = stationNum === 6 
                ? "p-3 rounded-2xl border-2 border-amber-400 bg-amber-700 text-white transition text-center shadow-lg scale-105" 
                : "p-3 rounded-2xl border border-amber-500/60 bg-amber-950 text-amber-200 hover:bg-amber-900 transition text-center shadow-md";

            renderStationContent();
        }

        function renderStationContent() {
            const scenarioBox = document.getElementById('scenario-box');
            const calcBox = document.getElementById('calculator-box');

            if (currentStation === 1) {
                scenarioBox.innerHTML = `
                    <div class="flex items-center space-x-2"><span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full">第一站 ｜ 職涯啟航港</span><span class="text-slate-400 text-xs">｜ 決策偏好剖析</span></div>
                    <h3 class="text-xl font-bold text-slate-900 mt-4">換工作時，你最優先考慮什麼？</h3>
                    <p class="text-slate-600 text-sm mt-3 leading-relaxed">你收到一份年薪更高的新工作 offer，但新公司的退休金配對與福利還不清楚。您的決策偏好傾向於哪一個方向？</p>
                    
                    <div class="mt-6 space-y-3">
                        <button onclick="chooseOption1('A')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">A. 薪資增加多少，直接決定我的選擇（聚焦現金流擴張）</button>
                        <button onclick="chooseOption1('B')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">B. 退休金配對、保險及總報酬優先（重視長遠福利與保障）</button>
                        <button onclick="chooseOption1('C')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">C. 工作穩定性、家庭時間及職涯發展優先（重視生活平衡與彈性）</button>
                    </div>

                    <div id="result-box-1" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <h4 id="res-title-1" class="font-bold text-teal-900 text-lg"></h4>
                        <p id="res-desc-1" class="text-slate-600 text-sm mt-2"></p>
                        <div class="mt-4 bg-teal-50 p-4 rounded-2xl border border-teal-100">
                            <span class="text-xs font-bold text-teal-800 uppercase tracking-wider">📖 決策維度解析</span>
                            <p id="res-knowledge-1" class="text-xs text-teal-950 mt-1 font-medium leading-relaxed"></p>
                        </div>
                    </div>
                `;
                calcBox.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-900 mb-1">🧮 總報酬與 401(k) 貢獻試算器</h3>
                    <p class="text-slate-500 text-xs mb-4">依據 IRS 規定，401(k) 員工貢獻上限隨年齡調整（未滿 50 歲 $24,500；50+ 歲 $32,500；60–63 歲最高 $35,750）。</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="bg-slate-50 p-4 rounded-xl"><label class="block text-xs font-medium text-slate-600 mb-1">現職年薪 ($):</label><input type="number" id="curr-salary" value="90000" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-slate-600 mt-2 mb-1">公司 Match (%):</label><input type="number" id="curr-match" value="5" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                        <div class="bg-teal-50/50 p-4 rounded-xl"><label class="block text-xs font-medium text-teal-800 mb-1">新 Offer 年薪 ($):</label><input type="number" id="new-salary" value="105000" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-teal-800 mt-2 mb-1">公司 Match (%):</label><input type="number" id="new-match" value="3" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                    </div>
                    <button onclick="calculateCompensation()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl text-sm">計算總報酬與提撥差距</button>
                    <div id="calc-result" class="hidden mt-4 p-4 bg-slate-900 text-white rounded-xl text-xs"><p id="res-curr-total"></p><p id="res-new-total" class="mt-1"></p><p id="res-analysis" class="mt-2 pt-2 border-t border-slate-800"></p></div>
                `;
            } else if (currentStation === 2) {
                scenarioBox.innerHTML = `
                    <div class="flex items-center space-x-2"><span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full">第二站 ｜ 安居生活城</span><span class="text-slate-400 text-xs">｜ 決策偏好剖析</span></div>
                    <h3 class="text-xl font-bold text-slate-900 mt-4">考慮購屋時，您最在意哪一項指標？</h3>
                    <p class="text-slate-600 text-sm mt-3 leading-relaxed">買房涉及頭期款、月付金以及長期維護成本。您的評估重心在哪裡？</p>
                    <div class="mt-6 space-y-3">
                        <button onclick="chooseOption2('A')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">A. 盡可能拉高頭期款壓低每月房貸月付金</button>
                        <button onclick="chooseOption2('B')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">B. 保留現金預備金，全面評估 PITI 加計維護與 HOA 成本</button>
                    </div>
                    <div id="result-box-2" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <h4 id="res-title-2" class="font-bold text-teal-900 text-lg"></h4>
                        <p id="res-desc-2" class="text-slate-600 text-sm mt-2"></p>
                        <div class="mt-4 bg-teal-50 p-4 rounded-2xl border border-teal-100">
                            <span class="text-xs font-bold text-teal-800 uppercase tracking-wider">📖 決策維度解析</span>
                            <p id="res-knowledge-2" class="text-xs text-teal-950 mt-1 font-medium leading-relaxed"></p>
                        </div>
                    </div>
                `;
                calcBox.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-900 mb-1">🧮 購屋總持有成本（PITI + 維護費）計算器</h3>
                    <p class="text-slate-500 text-xs mb-4">註：PITI 通常包含本金、利息、房屋稅與房屋保險；房屋維修、HOA 及 PMI 應另外獨立列示評估。</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="bg-slate-50 p-4 rounded-xl space-y-2"><label class="block text-xs font-medium text-slate-600">房屋總價 ($):</label><input type="number" id="home-price" value="400000" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-slate-600">頭期款 (%):</label><input type="number" id="down-pct" value="20" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                        <div class="bg-teal-50/50 p-4 rounded-xl space-y-2"><label class="block text-xs font-medium text-teal-800">年房屋稅 ($):</label><input type="number" id="property-tax" value="4800" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-teal-800">年房屋保險 ($):</label><input type="number" id="home-insurance" value="1500" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-teal-800">月維修/HOA預備金 ($):</label><input type="number" id="maintenance" value="300" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                    </div>
                    <button onclick="calculateHousing()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl text-sm">計算 PITI 與實際居住總支出</button>
                    <div id="calc-result-housing" class="hidden mt-4 p-4 bg-slate-900 text-white rounded-xl text-xs"><p id="res-total-piti" class="font-bold text-teal-300"></p></div>
                `;
            } else if (currentStation === 3) {
                scenarioBox.innerHTML = `
                    <div class="flex items-center space-x-2"><span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full">第三站 ｜ 下一代學院</span><span class="text-slate-400 text-xs">｜ 目標排序偏好</span></div>
                    <h3 class="text-xl font-bold text-slate-900 mt-4">在教育金籌備與自身退休金之間，您的優先順序為何？</h3>
                    <p class="text-slate-600 text-sm mt-3 leading-relaxed">父母希望給孩子最好的教育，但財務資源有限。不同的配置策略反映了不同的家庭目標排序。</p>
                    <div class="mt-6 space-y-3">
                        <button onclick="chooseOption3('A')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">A. 教育金優先：盡可能善用 529 帳戶為孩子存足大學學費</button>
                        <button onclick="chooseOption3('B')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">B. 退休與現金流優先：確保自身退休無虞後，再彈性規劃 529 與獎學金</button>
                    </div>
                    <div id="result-box-3" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <h4 id="res-title-3" class="font-bold text-teal-900 text-lg"></h4>
                        <p id="res-desc-3" class="text-slate-600 text-sm mt-2"></p>
                        <div class="mt-4 bg-teal-50 p-4 rounded-2xl border border-teal-100">
                            <span class="text-xs font-bold text-teal-800 uppercase tracking-wider">📖 決策維度解析</span>
                            <p id="res-knowledge-3" class="text-xs text-teal-950 mt-1 font-medium leading-relaxed"></p>
                        </div>
                    </div>
                `;
                calcBox.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-900 mb-1">🧮 529 教育金動態複利試算器</h3>
                    <p class="text-slate-500 text-xs mb-4">系統會依據您輸入的現有年齡與預計上大學年齡（動態計算距離年數）來試算複利成果。</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="bg-slate-50 p-4 rounded-xl space-y-2"><label class="block text-xs font-medium text-slate-600">孩子目前年齡 (歲):</label><input type="number" id="child-age" value="5" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-slate-600">預計上大學年齡 (歲):</label><input type="number" id="college-age" value="18" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                        <div class="bg-teal-50/50 p-4 rounded-xl space-y-2"><label class="block text-xs font-medium text-teal-800">每月投入金額 ($):</label><input type="number" id="monthly-saving" value="300" class="w-full p-2 border rounded-lg text-sm bg-white"><label class="block text-xs font-medium text-teal-800">預估年化報酬率 (%):</label><input type="number" id="edu-return" value="7" class="w-full p-2 border rounded-lg text-sm bg-white"></div>
                    </div>
                    <button onclick="calculateEducation()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl text-sm">計算教育金累積總額</button>
                    <div id="calc-result-edu" class="hidden mt-4 p-4 bg-slate-900 text-white rounded-xl text-xs"><p id="res-edu-total" class="font-bold text-teal-300"></p></div>
                `;
            } else if (currentStation === 4) {
                scenarioBox.innerHTML = `
                    <div class="flex items-center space-x-2"><span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full">第四站 ｜ 退休自由灣</span><span class="text-slate-400 text-xs">｜ 提領與風險偏好</span></div>
                    <h3 class="text-xl font-bold text-slate-900 mt-4">對於退休後的提領策略與市場風險，您的態度是？</h3>
                    <p class="text-slate-600 text-sm mt-3 leading-relaxed">4% 法則僅是歷史經驗形成的規劃參考，並非適用所有退休年期的保證答案。面對市場波動與長壽風險，您傾向如何佈局？</p>
                    <div class="mt-6 space-y-3">
                        <button onclick="chooseOption4('A')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">A. 積極投資與固定比例提領，追求資產成長但願承擔市場順序風險</button>
                        <button onclick="chooseOption4('B')" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-teal-500 transition text-sm font-medium">B. 建立 Tax diversification 與年金保障，重視現金流穩定與抗跌防禦</button>
                    </div>
                    <div id="result-box-4" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <h4 id="res-title-4" class="font-bold text-teal-900 text-lg"></h4>
                        <p id="res-desc-4" class="text-slate-600 text-sm mt-2"></p>
                        <div class="mt-4 bg-teal-50 p-4 rounded-2xl border border-teal-100">
                            <span class="text-xs font-bold text-teal-800 uppercase tracking-wider">📖 決策維度解析</span>
                            <p id="res-knowledge-4" class="text-xs text-teal-950 mt-1 font-medium leading-relaxed"></p>
                        </div>
                    </div>
                `;
                calcBox.innerHTML = `

        function calculateCompensation() {

        function calculateHousing() {
            const p = parseFloat(document.getElementById('home-price').value) || 0;
            const dp = parseFloat(document.getElementById('down-pct').value) || 0;
            const tax = parseFloat(document.getElementById('property-tax').value) || 0;
            const ins = parseFloat(document.getElementById('home-insurance').value) || 0;
            const maint = parseFloat(document.getElementById('maintenance').value) || 0;
            const loan = p * (1 - dp / 100);
            const pi = (loan * (0.065 / 12) * Math.pow(1 + 0.065 / 12, 360)) / (Math.pow(1 + 0.065 / 12, 360) - 1);
            const total = pi + (tax / 12) + (ins / 12) + maint;
            document.getElementById('calc-result-housing').classList.remove('hidden');
            document.getElementById('res-total-piti').innerText = `🏠 每月預估 PITI + 維護總支出：$${Math.round(total).toLocaleString()} / 月 (其中本利 $${Math.round(pi).toLocaleString()})`;
        }

        function calculateEducation() {
            const age = parseFloat(document.getElementById('child-age').value) || 0;

            const years = Math.max(1, collegeAge - age);

            const monthlyRate = rate / 100 / 12;
            const total = m * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);

            document.getElementById('calc-result-edu').classList.remove('hidden');
